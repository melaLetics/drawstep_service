name: Kartendaten aktualisieren

on:
  schedule:
    # Montags 04:23 UTC – Scryfall aktualisiert die Bulk-Daten alle 12 Stunden.
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      start:
        description: 'Starttag yyyy-mm-dd (nur beim ersten Lauf oder mit reset_plan)'
        required: false
        default: ''
      reset_plan:
        description: 'Zeitplan komplett neu erzeugen (nur vor dem Release!)'
        type: boolean
        default: false
      force:
        description: 'Auch ohne Änderung veröffentlichen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Abhängigkeiten
        run: dart pub get

      - name: Tests
        run: dart test

      - name: Bisherigen Stand holen (gh-pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$remote" site
          else
            mkdir site
          fi

      - name: Datenpaket bauen
        id: build
        env:
          START: ${{ inputs.start }}
          RESET_PLAN: ${{ inputs.reset_plan }}
          FORCE: ${{ inputs.force }}
        run: |
          args=(--site site)
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          if [ "$RESET_PLAN" = "true" ]; then args+=(--reset-plan); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          dart run bin/build.dart "${args[@]}"

      - name: Veröffentlichen
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          cd site
          # Ohne Historie veröffentlichen, damit der Branch nicht mit jedem Paket wächst.
          rm -rf .git
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Kartendaten $VERSION"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Veröffentlicht: $VERSION" >> "$GITHUB_STEP_SUMMARY"
